<!DOCTYPE html>
<html>
<head>
  <title>Admin – View Complaints</title>
</head>
<body>

<h2>Admin – View Complaints</h2>
<div id="complaints"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDRQgP8gk-3yzSOQDIvxiku5N0TV0H54b0",
    authDomain: "http://smart-campus-complaint-box.firebaseapp.com/",
    projectId: "smart-campus-complaint-box",
    appId: "1:686027057222:web:c8ba711c9bf6ba14d74247"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadComplaints() {
    const snapshot = await getDocs(collection(db, "complaints"));
    const container = document.getElementById("complaints");

    snapshot.forEach(doc => {
      const c = doc.data();

      const div = document.createElement("div");
      div.style.border = "1px solid black";
      div.style.padding = "10px";
      div.style.margin = "10px";

      div.innerHTML = `
        <p><b>Name:</b> ${c.name ? c.name : "Anonymous"}</p>
        <p><b>Category:</b> ${c.category}</p>
        <p><b>Location:</b> ${c.location}</p>
        <p><b>Description:</b> ${c.description}</p>
        <p><b>Status:</b> ${c.status ? c.status : "Pending"}</p>
        <hr>
      `;

      container.appendChild(div);
    });
  }

  loadComplaints();
</script>

</body>
</html>
